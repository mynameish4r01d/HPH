<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="../styles.css">

    <!--GOOGLE ICONS MATERIAL ROUNDED-->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,1,0" rel="stylesheet">

    <!--INTER FONT FAMILY-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/x-icon" href="../../global-elements/favicon.png">

    <title>Reset password | HPH Renewable</title>

    <!--JAVA SCRIPT-->
    <script type="module" src="reset-password.js"></script>

</head>
<body>

    <header class="admin-bar">
        <div class="admin-brand">
            <a href="../index.html" class="admin-logo" aria-label="HPH Renewable admin sign in">
                <img src="../../global-elements/HPH Renewable Black.png" alt="HPH Renewable" class="img">
            </a>
        </div>
    </header>

    <!-- The page Firebase's password-reset email links to (set as the action URL in
         Firebase console → Authentication → Templates). reset-password.js reads
         ?mode=resetPassword&oobCode=… from the address. -->
    <main class="admin-page">
        <section class="admin-login">
            <a href="../index.html" class="admin-back-site">
                <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
                Back to sign in
            </a>
            <h1 class="admin-title">Choose a new password</h1>
            <p class="admin-intro reset-intro">Checking your link…</p>

            <form class="admin-login-form reset-form" novalidate hidden>
                <label class="admin-field">
                    <span class="admin-label">New password</span>
                    <input type="password" name="password" autocomplete="new-password" minlength="8" required>
                </label>

                <label class="admin-field">
                    <span class="admin-label">Confirm new password</span>
                    <input type="password" name="confirm" autocomplete="new-password" minlength="8" required>
                </label>

                <p class="admin-error" role="alert" hidden></p>

                <button type="submit" class="admin-button">Save new password</button>
            </form>

            <a href="../index.html" class="admin-button reset-done" hidden>Go to sign in</a>
        </section>
    </main>

</body>
</html>
